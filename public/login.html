<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Đăng nhập · KingSMP Panel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme: light; --page:#f7f8fa; --surface:#fff; --surface-2:#f3f5f8; --text:#17202b; --text-2:#626d7d; --muted:#8993a2; --border:#e2e6ec; --accent:#bf7b22; --accent-soft:#fff4df; --red:#c04444; --red-soft:#fff0f0; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page:#0f141b; --surface:#171d26; --surface-2:#1e2632; --text:#e8edf4; --text-2:#a2adbd; --muted:#778296; --border:#2a3341; --accent:#e0a050; --accent-soft:#2c2417; --red:#ef8a8a; --red-soft:#2d1b1b; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 20px; background: var(--page); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; }
.card { width: 100%; max-width: 380px; padding: 32px 28px 26px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 2px 8px rgba(19,30,48,.05), 0 14px 40px rgba(19,30,48,.06); }
.brand { display: flex; flex-direction: column; gap: 2px; margin-bottom: 22px; }
.brand strong { font-size: 20px; }
.brand span { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 1.6px; }
label { display: block; margin-bottom: 8px; color: var(--text-2); font-size: 12px; font-weight: 600; }
.field { display: flex; gap: 8px; }
input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); font: inherit; }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--surface); }
.toggle { width: 42px; height: 42px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text-2); cursor: pointer; font-size: 15px; }
.toggle:hover { background: var(--surface-2); }
button.submit { width: 100%; height: 42px; margin-top: 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
button.submit:disabled { opacity: .6; cursor: not-allowed; }
.error { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--red-soft); color: var(--red); font-size: 13px; }
.error.show { display: block; }
.note { margin: 18px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><strong>KingSMP</strong><span>BOT PANEL</span></div>
  <form id="login-form" autocomplete="on">
    <label for="password">Mật khẩu bí mật</label>
    <div class="field">
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu…" required autofocus>
      <button class="toggle" id="toggle" type="button" aria-label="Hiện/ẩn mật khẩu">👁</button>
    </div>
    <button class="submit" id="submit" type="submit">Đăng nhập</button>
    <div class="error" id="error" role="alert"></div>
  </form>
  <p class="note">Chỉ dành cho chủ panel.</p>
</main>
<script>
(function () {
  var form = document.getElementById('login-form');
  var input = document.getElementById('password');
  var btn = document.getElementById('submit');
  var err = document.getElementById('error');
  document.getElementById('toggle').addEventListener('click', function () {
    input.type = input.type === 'password' ? 'text' : 'password';
  });
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Đang kiểm tra…';
    try {
      var res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: input.value })
      });
      var data = await res.json().catch(function () { return {}; });
      if (res.ok && data.ok) { location.href = '/'; return; }
      err.textContent = data.error || 'Đăng nhập thất bại.';
    } catch (_) {
      err.textContent = 'Không kết nối được tới server.';
    }
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Đăng nhập';
    input.select();
  });
})();
</script>
</body>
</html>
